{{- $src := .Get "src" -}}
{{- $alt := .Get "alt" | default "Home lab component" -}}
{{- $caption := .Get "caption" -}}
{{- $id := printf "lab-product-image-%d" .Ordinal -}}
<figure class="lab-product-image" style="display:flex;flex-direction:column;width:min(100%,240px);margin:1rem auto">
  <button class="lab-product-image__open" style="display:flex;align-items:center;justify-content:center;width:100%;height:160px;padding:.65rem;border:1px solid rgba(125,211,252,.22);border-radius:.7rem;background:#fff;cursor:zoom-in;overflow:hidden" type="button" aria-label="Open full-resolution image of {{ $alt }}" onclick="document.getElementById('{{ $id }}').showModal()">
    <img class="nozoom" style="display:block;width:100%;height:100%;margin:0;object-fit:contain" src="{{ $src }}" alt="{{ $alt }}" loading="lazy" decoding="async">
  </button>
  {{ with $caption }}<figcaption>{{ . }}</figcaption>{{ end }}
</figure>
<dialog id="{{ $id }}" class="lab-product-image__dialog" style="position:fixed;inset:0;width:92vw;max-width:1100px;height:92vh;max-height:none;padding:0;margin:auto;border:0;background:transparent;overflow:hidden" onclick="if(event.target===this)this.close()">
  <div class="lab-product-image__panel" style="position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:100%;padding:3rem 1rem 1rem;box-sizing:border-box;border-radius:.75rem;background:#12252c" onclick="if(event.target===this)this.parentElement.close()">
    <button class="lab-product-image__close" style="position:absolute;top:.5rem;right:.75rem;z-index:2;padding:.35rem .75rem;border:1px solid #27b9eb;border-radius:.3rem;background:#17343e;color:#fff;font-size:1rem;font-weight:700;line-height:1;cursor:pointer" type="button" aria-label="Close image" onclick="document.getElementById('{{ $id }}').close()">Close&nbsp; ×</button>
    <img class="nozoom" style="display:block;width:auto;height:auto;max-width:100%;max-height:100%;margin:0;object-fit:contain" src="{{ $src }}" alt="{{ $alt }}" decoding="async">
  </div>
</dialog>
