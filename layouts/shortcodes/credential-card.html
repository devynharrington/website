{{- $title := .Get "title" -}}
<article class="credential-card">
  <div class="credential-card__image-wrap">
    <img class="credential-card__image" src="{{ .Get "image" }}" width="600" height="600" alt="{{ $title }}" loading="lazy">
  </div>
  <div class="credential-card__body">
    <p class="credential-card__category">{{ .Get "category" }}</p>
    <h3 class="credential-card__title">{{ $title }}</h3>
    <p class="credential-card__issuer">Issued by {{ .Get "issuer" }}</p>
    {{- with .Get "issued" }}<p class="credential-card__dates">Issued {{ . }}{{ with $.Get "expires" }} · Expires {{ . }}{{ end }}</p>{{ end -}}
    <a class="credential-card__link" href="{{ .Get "url" }}" target="_blank" rel="noopener noreferrer" aria-label="Verify {{ $title }} on Credly">Verify on Credly <span aria-hidden="true">↗</span></a>
  </div>
</article>
