{{ $featured := resources.Get .Params.featureimage }}
{{ with $featured }}
  {{ $hero := .Resize "1600x webp q88" }}
  <style>
    article:has(> .article-cover-after-author) {
      display: flex;
      flex-direction: column;
    }
    article:has(> .article-cover-after-author) > header { order: 1; }
    article:has(> .article-cover-after-author) > .article-cover-after-author { order: 2; }
    article:has(> .article-cover-after-author) > section { order: 3; }
    article:has(> .article-cover-after-author) > footer { order: 4; }
  </style>
  <figure class="article-cover-after-author mt-0 mb-10 w-full max-w-prose overflow-hidden rounded-xl shadow-xl">
    <img
      src="{{ $hero.RelPermalink }}"
      width="{{ $hero.Width }}"
      height="{{ $hero.Height }}"
      alt="{{ $.Title }}"
      loading="eager"
      decoding="async"
      fetchpriority="high"
      class="block w-full h-auto nozoom">
  </figure>
{{ end }}
