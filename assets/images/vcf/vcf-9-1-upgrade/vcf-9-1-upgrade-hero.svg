<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
  <title id="title">VCF 9.0.x to 9.1 upgrade field notes</title>
  <desc id="desc">A visual upgrade path from VCF 9.0.x to VCF 9.1 covering Operations, licensing, lifecycle, Management Services, and Automation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1528"/>
      <stop offset="0.55" stop-color="#16243b"/>
      <stop offset="1" stop-color="#092b38"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7839c6"/>
      <stop offset="0.5" stop-color="#1a8ed1"/>
      <stop offset="1" stop-color="#16c2b8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="840" fill="url(#bg)"/>
  <circle cx="1390" cy="100" r="250" fill="#176d8d" opacity=".18" filter="url(#glow)"/>
  <circle cx="150" cy="790" r="280" fill="#6532a2" opacity=".17" filter="url(#glow)"/>
  <path d="M0 720 C360 610 560 805 910 690 C1190 600 1370 660 1600 545 V840 H0Z" fill="#07101f" opacity=".54"/>

  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <text x="800" y="196" fill="#8fd8f4" font-size="28" font-weight="700" letter-spacing="5">UPGRADE FIELD NOTES</text>
    <text x="800" y="316" fill="#ffffff" font-size="88" font-weight="800">VCF 9.0.x <tspan fill="#45c5e9">→</tspan> 9.1</text>
    <text x="800" y="374" fill="#c9d6e7" font-size="30">The architecture, planning, and lifecycle changes that matter</text>
  </g>

  <rect x="224" y="457" width="1152" height="4" rx="2" fill="url(#accent)"/>
  <g font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <g transform="translate(188 0)">
      <circle cx="0" cy="459" r="18" fill="#16243b" stroke="#9055dd" stroke-width="5"/>
      <rect x="-83" y="506" width="166" height="62" rx="18" fill="#17253a" stroke="#3d526c"/>
      <text x="0" y="545" fill="#ffffff">Operations PAK</text>
    </g>
    <g transform="translate(492 0)">
      <circle cx="0" cy="459" r="18" fill="#16243b" stroke="#6479e8" stroke-width="5"/>
      <rect x="-79" y="506" width="158" height="62" rx="18" fill="#17253a" stroke="#3d526c"/>
      <text x="0" y="545" fill="#ffffff">Licensing</text>
    </g>
    <g transform="translate(800 0)">
      <circle cx="0" cy="459" r="18" fill="#16243b" stroke="#2d9bd4" stroke-width="5"/>
      <rect x="-108" y="506" width="216" height="62" rx="18" fill="#17253a" stroke="#3d526c"/>
      <text x="0" y="545" fill="#ffffff">SDDC Lifecycle</text>
    </g>
    <g transform="translate(1110 0)">
      <circle cx="0" cy="459" r="18" fill="#16243b" stroke="#1db6c2" stroke-width="5"/>
      <rect x="-126" y="506" width="252" height="62" rx="18" fill="#17253a" stroke="#3d526c"/>
      <text x="0" y="545" fill="#ffffff">Management Services</text>
    </g>
    <g transform="translate(1412 0)">
      <circle cx="0" cy="459" r="18" fill="#16243b" stroke="#1bc7a8" stroke-width="5"/>
      <rect x="-91" y="506" width="182" height="62" rx="18" fill="#17253a" stroke="#3d526c"/>
      <text x="0" y="545" fill="#ffffff">Automation</text>
    </g>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="21" font-weight="650" text-anchor="middle" fill="#b9c8dc">
    <text x="800" y="672">
      <tspan>DNS + IP planning</tspan><tspan fill="#48617f">  •  </tspan>
      <tspan>Fleet Lifecycle</tspan><tspan fill="#48617f">  •  </tspan>
      <tspan>Validation</tspan><tspan fill="#48617f">  •  </tspan>
      <tspan>Lessons learned in the field</tspan>
    </text>
  </g>
</svg>
