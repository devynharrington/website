baseURL = "https://devynharrington.com/"
title = "Devyn Harrington"
theme = "blowfish"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  description = "Personal portfolio and VCF field notes from Devyn Harrington, a Practice Manager, VMware Cloud Foundation Architect, Broadcom VCF Knight, Marine Corps veteran, and federal infrastructure leader."

  [params.search]
    enable = true 

  # Homepage profile layout
  [params.homepage]
    layout = "profile"
    showRecent = false
    recentLimit = 3

    [params.homepage.profile]
      imageWidth = 300
      imageHeight = 300
      imageQuality = 100

  # Favicon configuration
  [params.favicon]
    ico = "favicon.ico"
    png = "favicon-32x32.png"
    apple = "apple-touch-icon.png"

  [params.author]
    name = "Devyn Harrington"
    image = "img/profile.jpg"
    headline = "Practice Manager & VCF Architect | Broadcom VCF Knight | Federal & DoW Infrastructure"

    links = [
      { linkedin = "https://www.linkedin.com/in/devynharrington" },
      { github = "https://github.com/devynharrington" },
    ]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2
    ordered = false

[menu]

  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 2

  [[menu.main]]
    name = "VCF"
    url = "/vcf/"
    weight = 4

  [[menu.main]]
    name = "Career"
    url = "/career/"
    weight = 3

  [[menu.main]]
    name = "Home Lab"
    url = "/homelab/"
    weight = 5

  [[menu.main]]
    name = "Certifications"
    url = "/certifications/"
    weight = 6
