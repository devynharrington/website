<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">VCF Management Services duplicate FQDN validation</title>
  <desc id="desc">Sanitized Components Installation screen showing validation failures when the runtime, fleet, and instance endpoints reuse an FQDN or IP address.</desc>
  <defs>
    <style>
      .ui{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#dce8ec}.muted{fill:#a9bac0}.label{font-size:19px;font-weight:600}.body{font-size:18px}.small{font-size:15px}.value{font-size:18px;fill:#e8f2f5}.button{font-size:16px;font-weight:700;letter-spacing:.04em}.error{font-size:17px;fill:#fff}.title{font-size:24px;font-weight:600}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#071117" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#162a31"/>
  <rect x="55" y="45" width="1490" height="810" rx="8" fill="#183139" filter="url(#shadow)"/>
  <rect x="55" y="45" width="1490" height="65" rx="8" fill="#203d45"/>
  <rect x="55" y="102" width="1490" height="8" fill="#203d45"/>
  <text x="85" y="87" class="ui title">Components Installation</text>
  <text x="1505" y="87" text-anchor="end" class="ui title">×</text>

  <rect x="85" y="135" width="1430" height="45" rx="3" fill="#2d7615"/>
  <circle cx="108" cy="157" r="11" fill="none" stroke="#c9e7bf" stroke-width="2"/>
  <path d="M102 157l5 5 9-11" fill="none" stroke="#c9e7bf" stroke-width="2"/>
  <text x="130" y="164" class="ui body">Successfully connected to VCF Operations instance vcf-ops-01.example.com</text>
  <text x="1485" y="164" text-anchor="end" class="ui body" text-decoration="underline">Use a different instance</text>

  <text x="85" y="220" class="ui title">Deployment Parameters</text>
  <text x="85" y="258" class="ui body">Components are deployed in the management domain of the VCF Instance. The VCF management services components operate at the fleet level or instance level.</text>
  <text x="85" y="284" class="ui body">Passwords will be autogenerated and you must store them. All fields marked with * are required.</text>
  <text x="85" y="330" class="ui body">Enter the VCF management services components details:</text>

  <rect x="85" y="350" width="1430" height="145" rx="4" fill="#aa1d0e" stroke="#e54c33" stroke-width="2"/>
  <circle cx="112" cy="380" r="13" fill="none" stroke="#fff" stroke-width="2"/><text x="112" y="387" text-anchor="middle" class="error">!</text>
  <text x="140" y="387" class="error">Found same FQDN being used for one or more of the following: VCF services runtime FQDN, Fleet components FQDN, Instance components FQDN.</text>
  <circle cx="112" cy="423" r="13" fill="none" stroke="#fff" stroke-width="2"/><text x="112" y="430" text-anchor="middle" class="error">!</text>
  <text x="140" y="430" class="error">FQDN vcf-runtime-01.example.com for product VSP is already used in the input specification for another component</text>
  <circle cx="112" cy="466" r="13" fill="none" stroke="#fff" stroke-width="2"/><text x="112" y="473" text-anchor="middle" class="error">!</text>
  <text x="140" y="473" class="error">IP address 192.0.2.42 for product VSP is already resolved from an FQDN in the input specification</text>

  <text x="90" y="555" class="ui label">VCF services runtime CIDR *</text>
  <text x="590" y="555" class="ui value">192.0.2.160/28</text>
  <line x1="585" y1="568" x2="1110" y2="568" stroke="#6d858c" stroke-width="2"/>
  <text x="590" y="590" class="ui muted small">Minimum 12 IPs for current scope or 30 IPs to allow for more components and auto-scaling</text>

  <text x="90" y="645" class="ui label">VCF services runtime FQDN ⓘ *</text>
  <text x="590" y="645" class="ui value">vcf-runtime-01.example.com</text>
  <line x1="585" y1="658" x2="1110" y2="658" stroke="#6d858c" stroke-width="2"/>

  <text x="90" y="705" class="ui label">VCF services runtime size *</text>
  <text x="590" y="705" class="ui value">Medium⌄</text>

  <text x="90" y="765" class="ui label">Fleet components FQDN ⓘ *</text>
  <text x="590" y="765" class="ui value">vcf-runtime-01.example.com</text>
  <line x1="585" y1="778" x2="1110" y2="778" stroke="#6d858c" stroke-width="2"/>

  <text x="90" y="825" class="ui label">Instance components FQDN ⓘ *</text>
  <text x="590" y="825" class="ui value">vcf-instance-01.example.com</text>
  <line x1="585" y1="838" x2="1110" y2="838" stroke="#6d858c" stroke-width="2"/>

  <rect x="1300" y="795" width="95" height="45" rx="3" fill="none" stroke="#21b8ea" stroke-width="2"/>
  <text x="1348" y="824" text-anchor="middle" class="ui button" fill="#39c4f0">CANCEL</text>
  <rect x="1410" y="795" width="105" height="45" rx="3" fill="#18aee4"/>
  <text x="1462" y="824" text-anchor="middle" class="ui button">INSTALL</text>
</svg>
